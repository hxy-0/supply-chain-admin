server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = /healthz { access_log off; return 200 'ok'; }
    location ~ ^/(api/)?(actuator|mock|v3/api-docs|swagger-ui)(/|$) { return 404; }

    # 与 vite.config.ts 的代理规则一致，这些后端路由自身含 /api 前缀。
    location ~ ^/api/(auth|mp|wechat|drivers|product-images|products|categories|brands|skus|attributes)(/|$) {
        proxy_pass http://192.168.9.102:18081;
    }
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://192.168.9.102:18081;
    }
    location ~ ^/(auth|system)(/|$) {
        proxy_pass http://192.168.9.102:18081;
    }
    location /static/ {
        expires 1y;
        add_header Cache-Control 'public, immutable';
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ /index.html;
    }
}
